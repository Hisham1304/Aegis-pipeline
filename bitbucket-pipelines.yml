image: docker:24.0.5

definitions:
  services:
    docker:
      image: docker:24.0.5-dind

pipelines:
  branches:
    main:
      - step: *security-scan-step
    develop:
      - step: *security-scan-step

  pull-requests:
    '**':
      - step: *security-scan-step

  custom:
    manual-scan:
      - step: *security-scan-step

# Reusable step definition (keeps the YAML DRY)
steps:
  - &security-scan-step
    name: "Aegis Security Scan"
    services:
      - docker
    size: 2x       # optional: give more resources if needed
    script:
      - echo "Workspace: $BITBUCKET_CLONE_DIR"
      # portable jq install (detect package manager)
      - |
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq jq
        elif command -v apk >/dev/null 2>&1; then
          apk update && apk add --no-cache jq
        elif command -v yum >/dev/null 2>&1; then
          yum install -y -q jq
        else
          echo "No supported package manager found — provide an image with jq preinstalled"
          exit 1
        fi
      - docker version || true
      - mkdir -p results

      - echo "Pulling Aegis image..."
      - docker pull playerunknown23/aegis:latest || true

      - echo "Running Aegis scanner container..."
      - |
        docker run --rm \
          -v "$BITBUCKET_CLONE_DIR":/app/target:ro \
          -v "$BITBUCKET_CLONE_DIR/results":/app/results:rw \
          -e AEGIS_API_KEY="$AEGIS_API_KEY" \
          -e CONFIG_API_URL="$CONFIG_API_URL" \
          -e BITBUCKET_REPO_FULL_NAME="$BITBUCKET_REPO_FULL_NAME" \
          -e BITBUCKET_BRANCH="$BITBUCKET_BRANCH" \
          -e BITBUCKET_COMMIT="$BITBUCKET_COMMIT" \
          playerunknown23/aegis:latest \
          /app/target \
          --api-key "$AEGIS_API_KEY" \
          ${CONFIG_API_URL:+--config-api-url "$CONFIG_API_URL"} \
          --parallel || true

      - echo "Display scan summary (if present)"
      - |
        if ls results/scan_summary_*.json >/dev/null 2>&1; then
          fname=$(ls results/scan_summary_*.json | head -n1)
          echo "---- Aegis scan summary (from $fname) ----"
          cat "$fname" | jq -r '
            "**Summary:**\n" +
            "- Packages Found (SBOM): \(.summary.packages_found // "N/A") + "\n" +
            "- Vulnerabilities in Packages (SCA): \(.summary.vulnerabilities_in_packages // "N/A") + "\n" +
            "- Secrets Found: \(.summary.secrets_found // "N/A") + "\n" +
            "- Code Vulnerabilities: \(.summary.code_vulnerabilities // "N/A") + "\n\n" +
            "**Severity Breakdown:**\n" +
            "- Critical: \(.summary.critical_severity // 0) + "\n" +
            "- High: \(.summary.high_severity // 0) + "\n" +
            "- Medium: \(.summary.medium_severity // 0) + "\n" +
            "- Low: \(.summary.low_severity // 0) + "\n"
          '
          QG=$(cat "$fname" | jq -r '.metadata.quality_gate_passed // empty')
          if [ -n "$QG" ]; then
            if [ "$QG" = "true" ]; then
              echo -e "\n✅ Quality Gate: PASSED"
            else
              echo -e "\n❌ Quality Gate: FAILED"
              cat "$fname" | jq -r '.metadata.quality_gate_reasons[]? | "- \(.)"'
              # Optionally fail the step on quality-gate failure:
              # exit 1
            fi
          fi
        else
          echo "No scan_summary_*.json found in results/ — skipping summary"
        fi

    artifacts:
      - results/**