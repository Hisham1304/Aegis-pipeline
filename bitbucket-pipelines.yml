image: docker:24.0.5

pipelines:
  branches:
    main:
      - step:
          name: Aegis Security Scan (main)
          size: 2x
          services:
            - docker
          caches:
            - docker
          script:
            - 'sh -c "echo Workspace: $BITBUCKET_CLONE_DIR; if command -v apt-get >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq jq; elif command -v apk >/dev/null 2>&1; then apk add --no-cache jq; elif command -v yum >/dev/null 2>&1; then yum install -y -q jq; else echo \"No supported package manager found\" && exit 1; fi; docker pull playerunknown23/aegis:latest || true; mkdir -p \"$BITBUCKET_CLONE_DIR/results\"; if [ -n \"$CONFIG_API_URL\" ]; then CONFIG_ARG=\"--config-api-url=$CONFIG_API_URL\"; else CONFIG_ARG=\"\"; fi; docker run --rm -v \"$BITBUCKET_CLONE_DIR\":/app/target:ro -v \"$BITBUCKET_CLONE_DIR/results\":/app/results:rw -e AEGIS_API_KEY=\"$AEGIS_API_KEY\" -e CONFIG_API_URL=\"$CONFIG_API_URL\" -e BITBUCKET_REPO_FULL_NAME=\"$BITBUCKET_REPO_FULL_NAME\" -e BITBUCKET_BRANCH=\"$BITBUCKET_BRANCH\" -e BITBUCKET_COMMIT=\"$BITBUCKET_COMMIT\" playerunknown23/aegis:latest /app/target --api-key \"$AEGIS_API_KEY\" $CONFIG_ARG --parallel; if ls \"$BITBUCKET_CLONE_DIR/results\"/scan_summary_*.json >/dev/null 2>&1; then fname=$(ls \"$BITBUCKET_CLONE_DIR/results\"/scan_summary_*.json | head -n1); echo \"---- Aegis scan summary (from $fname) ----\"; cat \"$fname\" | jq -r \".summary\"; else echo \"No scan_summary_*.json found\"; fi"'
          artifacts:
            - results/**

    develop:
      - step:
          name: Aegis Security Scan (develop)
          size: 2x
          services:
            - docker
          caches:
            - docker
          script:
            - 'sh -c "echo Workspace: $BITBUCKET_CLONE_DIR; if command -v apt-get >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq jq; elif command -v apk >/dev/null 2>&1; then apk add --no-cache jq; elif command -v yum >/dev/null 2>&1; then yum install -y -q jq; else echo \"No supported package manager found\" && exit 1; fi; docker pull playerunknown23/aegis:latest || true; mkdir -p \"$BITBUCKET_CLONE_DIR/results\"; if [ -n \"$CONFIG_API_URL\" ]; then CONFIG_ARG=\"--config-api-url=$CONFIG_API_URL\"; else CONFIG_ARG=\"\"; fi; docker run --rm -v \"$BITBUCKET_CLONE_DIR\":/app/target:ro -v \"$BITBUCKET_CLONE_DIR/results\":/app/results:rw -e AEGIS_API_KEY=\"$AEGIS_API_KEY\" -e CONFIG_API_URL=\"$CONFIG_API_URL\" playerunknown23/aegis:latest /app/target --api-key \"$AEGIS_API_KEY\" $CONFIG_ARG --parallel; if ls \"$BITBUCKET_CLONE_DIR/results\"/scan_summary_*.json >/dev/null 2>&1; then fname=$(ls \"$BITBUCKET_CLONE_DIR/results\"/scan_summary_*.json | head -n1); echo \"---- Aegis scan summary (from $fname) ----\"; cat \"$fname\" | jq -r \".summary\"; else echo \"No scan_summary_*.json found\"; fi"'
          artifacts:
            - results/**

  pull-requests:
    '**':
      - step:
          name: Aegis Security Scan (PR)
          size: 2x
          services:
            - docker
          caches:
            - docker
          script:
            - 'sh -c "echo Workspace: $BITBUCKET_CLONE_DIR (PR); if command -v apt-get >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq jq; elif command -v apk >/dev/null 2>&1; then apk add --no-cache jq; fi; docker pull playerunknown23/aegis:latest || true; mkdir -p \"$BITBUCKET_CLONE_DIR/results\"; if [ -n \"$CONFIG_API_URL\" ]; then CONFIG_ARG=\"--config-api-url=$CONFIG_API_URL\"; else CONFIG_ARG=\"\"; fi; docker run --rm -v \"$BITBUCKET_CLONE_DIR\":/app/target:ro -v \"$BITBUCKET_CLONE_DIR/results\":/app/results:rw -e AEGIS_API_KEY=\"$AEGIS_API_KEY\" -e CONFIG_API_URL=\"$CONFIG_API_URL\" playerunknown23/aegis:latest /app/target --api-key \"$AEGIS_API_KEY\" $CONFIG_ARG --parallel; if ls \"$BITBUCKET_CLONE_DIR/results\"/scan_summary_*.json >/dev/null 2>&1; then fname=$(ls \"$BITBUCKET_CLONE_DIR/results\"/scan_summary_*.json | head -n1); echo \"---- Aegis scan summary (from $fname) ----\"; cat \"$fname\" | jq -r \".summary\"; else echo \"No scan_summary_*.json found\"; fi"'
          artifacts:
            - results/**

  custom:
    manual-scan:
      - step:
          name: Aegis Security Scan (manual)
          size: 2x
          services:
            - docker
          caches:
            - docker
          script:
            - 'sh -c "echo Manual run: Aegis Security Scan; if command -v apk >/dev/null 2>&1; then apk add --no-cache jq; elif command -v apt-get >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq jq; fi; docker pull playerunknown23/aegis:latest || true; mkdir -p \"$BITBUCKET_CLONE_DIR/results\"; if [ -n \"$CONFIG_API_URL\" ]; then CONFIG_ARG=\"--config-api-url=$CONFIG_API_URL\"; else CONFIG_ARG=\"\"; fi; docker run --rm -v \"$BITBUCKET_CLONE_DIR\":/app/target:ro -v \"$BITBUCKET_CLONE_DIR/results\":/app/results:rw -e AEGIS_API_KEY=\"$AEGIS_API_KEY\" -e CONFIG_API_URL=\"$CONFIG_API_URL\" playerunknown23/aegis:latest /app/target --api-key \"$AEGIS_API_KEY\" $CONFIG_ARG --parallel; if ls \"$BITBUCKET_CLONE_DIR/results\"/scan_summary_*.json >/dev/null 2>&1; then fname=$(ls \"$BITBUCKET_CLONE_DIR/results\"/scan_summary_*.json | head -n1); echo \"---- Aegis scan summary (from $fname) ----\"; cat \"$fname\" | jq -r \".summary\"; else echo \"No scan_summary_*.json found\"; fi"'
          artifacts:
            - results/**
