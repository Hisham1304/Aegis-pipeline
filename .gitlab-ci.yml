# .gitlab-ci.yml — minimal Aegis scan (hardcoded credentials for temporary testing)
stages:
  - test

# Global variables for Docker-in-Docker
variables:
  DOCKER_TLS_CERTDIR: ""            # allow DinD without TLS certs
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2

security-scan:
  stage: test
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    # *** DANGEROUS: credentials in repo (temporary only) ***
    AEGIS_API_KEY: "aegis_LJvDFv7nhDBxNOac7AcWJoVoR9T79t6A"
    CONFIG_API_URL: "https://config-api-mja3.onrender.com/"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
      when: on_success
    - when: manual
  before_script:
    - mkdir -p results
  script:
    - echo "=== Pulling Aegis image ==="
    - docker pull playerunknown23/aegis:latest || true
    - echo "=== Running Aegis scanner ==="
    - |
      set -euo pipefail

      # compute CONFIG_ARG in same shell
      if [ -n "${CONFIG_API_URL:-}" ]; then
        CONFIG_ARG="--config-api-url=${CONFIG_API_URL}"
      else
        CONFIG_ARG=""
      fi

      # show sanitized command for logs (mask key)
      echo "Running: docker run --rm playerunknown23/aegis:latest /app/target --api-key ****** $CONFIG_ARG --parallel"

      docker run --rm \
        -v "$CI_PROJECT_DIR":/app/target:ro \
        -v "$CI_PROJECT_DIR/results":/app/results:rw \
        -e AEGIS_API_KEY="$AEGIS_API_KEY" \
        -e CONFIG_API_URL="$CONFIG_API_URL" \
        playerunknown23/aegis:latest \
        /app/target --api-key "$AEGIS_API_KEY" $CONFIG_ARG --parallel
  artifacts:
    paths:
      - results/
    when: always
    expire_in: 30 days
  allow_failure: false


